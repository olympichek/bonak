name: rocq-action

on:
  push:
    paths:
      - "**.v"
      - "bonak.opam"
      - "dune-project"
      - "**/dune"
      - ".github/rocq-9.2-blacklist.txt"
      - ".github/workflows/coq-action.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**.v"
      - "bonak.opam"
      - "dune-project"
      - "**/dune"
      - ".github/rocq-9.2-blacklist.txt"
      - ".github/workflows/coq-action.yml"
jobs:
  # Builds the project with Rocq 9.2, minus the files listed in
  # .github/rocq-9.2-blacklist.txt.
  rocq-release:
    name: "Rocq 9.2"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
        with:
          submodules: "true"
      - name: "Apply the blacklist"
        run: xargs -r rm -- < .github/rocq-9.2-blacklist.txt
      - name: "Docker Rocq action"
        uses: "coq-community/docker-coq-action@v1"
        with:
          opam_file: "bonak.opam"
          coq_version: "9.2"
          before_install: |
            startGroup "Configure opam"
              if opam pin list --short | grep -qx dune; then
                opam unpin -y dune
              fi
              opam config list
              opam repo list
              opam list
            endGroup
          install: |
            startGroup "Install dependencies"
              sudo apt-get update -y -q
              opam pin add -n -y -k path $PACKAGE $WORKDIR
              opam update -y default
              opam install --confirm-level=unsafe-yes -j 2 $PACKAGE --deps-only
            endGroup

  # Builds the whole project with fixpoint refolding and the kernel/frontend
  # conversion optimizations used by the higher-coherence constructions.
  rocq-patched:
    name: "Rocq master+bonak-patches-experimental"
    runs-on: "ubuntu-latest"
    timeout-minutes: 240
    env:
      ROCQ_REPO: "https://github.com/olympichek/rocq.git"
      ROCQ_BRANCH: "master+bonak-patches-experimental"
      # Maintain the compiler and stdlib together on matching branches.
      STDLIB_REPO: "https://github.com/olympichek/rocq-stdlib.git"
      STDLIB_BRANCH: "master+bonak-patches-experimental"
      OCAML_COMPILER: "5.3"
      # Bound both conversion caches to 4M entries per conversion session.
      ROCQ_CONV_CACHE_MAX: "4194304"
      ROCQ_CLOS_MEMO_MAX: "4194304"
    steps:
      - uses: "actions/checkout@v4"
        with:
          submodules: "true"
      - name: "Resolve the experimental toolchain revisions"
        id: "toolchain"
        run: |
          rocq_sha=$(git ls-remote "$ROCQ_REPO" "refs/heads/$ROCQ_BRANCH" | cut -f1)
          stdlib_sha=$(git ls-remote "$STDLIB_REPO" "refs/heads/$STDLIB_BRANCH" | cut -f1)
          test -n "$rocq_sha"
          test -n "$stdlib_sha"
          echo "Rocq $ROCQ_BRANCH at $rocq_sha"
          echo "Stdlib $STDLIB_BRANCH at $stdlib_sha"
          echo "rocq_sha=$rocq_sha" >> "$GITHUB_OUTPUT"
          echo "stdlib_sha=$stdlib_sha" >> "$GITHUB_OUTPUT"
      - uses: "ocaml/setup-ocaml@v3"
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          opam-pin: false
      # Cache the opam switch by compiler and stdlib revision, so updating
      # either source rebuilds the corresponding switch.
      - name: "Restore the opam switch"
        id: "switch"
        uses: "actions/cache@v4"
        with:
          path: "_opam"
          key: "rocq-patched-${{ runner.os }}-ocaml-${{ env.OCAML_COMPILER }}-${{ steps.toolchain.outputs.rocq_sha }}-${{ steps.toolchain.outputs.stdlib_sha }}"
      - name: "Build the patched Rocq"
        env:
          ROCQ_REV: ${{ steps.toolchain.outputs.rocq_sha }}
          STDLIB_REV: ${{ steps.toolchain.outputs.stdlib_sha }}
        if: steps.switch.outputs.cache-hit != 'true'
        run: |
          opam pin add -y -n rocq-runtime "git+$ROCQ_REPO#$ROCQ_REV"
          opam pin add -y -n rocq-core "git+$ROCQ_REPO#$ROCQ_REV"
          opam pin add -y -n rocq-stdlib "git+$STDLIB_REPO#$STDLIB_REV"
          opam install -y -j "$(nproc)" rocq-core rocq-stdlib
      - name: "Install the remaining dependencies"
        run: opam install -y -j "$(nproc)" ./bonak.opam --deps-only
      - name: "Build"
        run: |
          opam exec -- rocq --version
          nproc
          free -h
          /usr/bin/time -v opam exec -- dune build
